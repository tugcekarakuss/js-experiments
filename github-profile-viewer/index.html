<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and explore GitHub user profiles, repositories, followers and stats in a clean and modern interface."
    />
    <meta
      name="keywords"
      content="GitHub profile viewer, GitHub user search, GitHub API project, frontend project, JavaScript project"
    />
    <meta name="author" content="Tugce Karakus" />
    <!-- og tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GitHub Profile Viewer" />
    <meta
      property="og:description"
      content="Explore GitHub users, repositories and stats with a modern UI."
    />
    <meta property="og:image" content="./images/project-preview.png" />
    <meta property="og:url" id="https://github-profile-viewerrrr.netlify.app/" />
    <meta property="og:site_name" content="GitHub Profile Viewer" />

    <!-- twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitHub Profile Viewer" />
    <meta
      name="twitter:description"
      content="Search and analyze GitHub users instantly."
    />
    <meta name="twitter:image" content="./images/project-preview.png" />
    <meta name="twitter:creator" content="@Tuvcirella" />

    <title>GitHub Profile Viewer | Search & Analyze GitHub Users</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>GitHub Profile Viewer</h1>
    </header>
    <main class="container">
      <div class="search-box">
        <input
          type="text"
          id="usernameInput"
          placeholder="Enter GitHub Username..."
        />
        <button id="searchBtn">Search</button>
      </div>

      <div id="statusMessage" class="status"></div>
      <div id="errorContainer" class="error-container hidden">
        <img
          src="images/error-github.png"
          alt="User Not Found"
          class="error-image"
        />
        <p>Oops! User not found. Try another username.</p>
      </div>

      <section id="profileSection" class="profile hidden">
        <div class="profile-left">
          <img id="avatar" />
        </div>

        <div class="profile-right">
          <h2 id="name"></h2>
          <p id="bio"></p>

          <div class="stats">
            <span id="followers"></span>
            <span id="following"></span>
            <span id="reposCount"></span>
          </div>

          <a id="profileLink" target="_blank">View on GitHub</a>
        </div>
      </section>

      <section id="repoSection" class="repos hidden">
        <h3>Repositories</h3>
        <div id="repoList"></div>
      </section>
      <div class="fixed-gif-container">
        <div class="speech-bubble">
          <span>Hey! Type a username to see the magic!</span>
        </div>
        <img src="images/github-gif.gif" alt="Sabit GIF" class="fixed-gif" />
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
