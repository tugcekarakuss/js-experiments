<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Character Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h2>Message</h2>
    <textarea id="textInput" placeholder="Type something..."></textarea>

    <div class="info">
      <span id="count">0</span>/20
    </div>

    <p id="warning"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
