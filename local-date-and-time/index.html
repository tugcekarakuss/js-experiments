<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Date & Time</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Live Clock and Date | JavaScript Project</title>
    <meta
      name="description"
      content="A live clock and date application built with JavaScript that updates in real time."
    />
    <meta
      name="keywords"
      content="javascript clock, live clock, date time app, js project, frontend project"
    />
    <meta name="author" content="Tugce Karakus" />

    <!-- Open Graph / Social Media -->
    <meta
      property="og:title"
      content="Live Clock and Date | JavaScript Project"
    />
    <meta
      property="og:description"
      content="A simple yet functional live clock and date application built using JavaScript."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="./images/favicon.ico" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article>
        <div class="date-time">
          <div class="current-time">
            <h1>Current Time</h1>
            <h2 class="time">10:30 AM</h2>
          </div>
          <div class="current-date">
            <p class="date"></p>
            <p class="quote">lets make this moment count! ✧˖°</p>
          </div>
        </div>
        <img src="images/snowman.png" alt="Snowman illustration" />
      </article>
    </main>
    <script src="script.js"></script>
  </body>
</html>
