<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tip Calculator</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator">
      <h1 class="calculator__title">Tip Calculator</h1>
      <form class="calculator__form">
        <div class="form__group">
          <label for="bill">Bill Amount</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-receipt"></i>
            <input
              type="number"
              id="bill"
              placeholder="Enter total bill"
              min="0"
            />
          </div>
        </div>
        <div class="form__group">
          <label for="people">Number of Guests</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user-group"></i>
            <input
              type="number"
              id="people"
              placeholder="How many people?"
              min="1"
            />
          </div>
        </div>

        <div class="form__group">
          <label for="service">Service Quality</label>
          <select id="service">
            <option value="">Choose service quality</option>
            <option value="0.3">30% – Outstanding</option>
            <option value="0.2">20% – Good</option>
            <option value="0.15">15% – It was OK</option>
            <option value="0.1">10% – Bad</option>
            <option value="0.05">5% – Terrible</option>
          </select>
        </div>

        <div class="button-group">
          <button type="button" id="calculate-btn" class="calculate-btn">
            Calculate
          </button>

          <button type="button" id="clear-btn" class="clear-btn">Clear</button>
        </div>

        <div class="result">
          <p class="result__label">Tip per person</p>
          <p class="result__value"><span id="tip-amount">0.00</span> $</p>
        </div>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
